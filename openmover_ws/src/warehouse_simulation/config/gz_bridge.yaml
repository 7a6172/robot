# Gazebo Harmonic <-> ROS 2 bridge configuration (ros_gz_bridge)
#
# Simulation data flow (faithful to ROS 1 gazebo_ros plugins):
#   gz DiffDrive            <- /model/pioneer3dx/cmd_vel   (from cmd_vel, key_control/Nav2)
#   gz DiffDrive            -> pioneer_odom  -> /odom      (nav_msgs/Odometry)
#   gz DiffDrive TF         -> pioneer_tf    -> /tf        (odom->base_link)
#   gz JointStatePublisher  -> pioneer_joint_states -> /joint_states
#   gz gpu_lidar            -> scan                        (sensor_msgs/LaserScan)
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/pioneer3dx/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "pioneer_odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "pioneer_tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "pioneer_joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
