# slam_toolbox async online mapping, derived from the ROS 1 gmapping args:
#   delta 0.05 -> resolution, maxRange 10 -> max_laser_range,
#   temporalUpdate 1.0 -> minimum_time_interval, linearUpdate 0.3 ->
#   minimum_travel_distance, angularUpdate 0.3 -> minimum_travel_heading,
#   map_update_interval 2.0 -> map_update_interval_sec
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval_sec: 2.0
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # General params
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 0.4
    loop_match_minimum_response_coarse: 0.8
    loop_match_minimum_response_fine: 0.8

    # Correlation params
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure correlation params
    loop_correlation_search_space_dimension: 0.3
    loop_correlation_search_space_resolution: 0.01
    loop_correlation_search_space_smear_deviation: 0.03

    # Scan matcher params
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Map
    resolution: 0.05
    max_laser_range: 10.0
    # ROS 1 gmapping used 1.0 s; at a 5 Hz lidar that is too sparse for the
    # scan matcher to keep up while teleop-ing -> smeared "starburst" map.
    minimum_time_interval: 0.2
