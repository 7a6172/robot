schema: 1
name: openmover
version: 0.4.0
components:
  isaac_sim: true
  isaac_lab: true
  ros2: true
  nav2: true
requires:
  ros2:
    version: jazzy
  isaac_sim:
    version: ">=5.0"
  isaac_lab:
    version: ">=2.0"
  nav2: {}
  # Interaction tier (bringup.launch.py interaction:=true). Not needed for a diagnostic or
  # stationary bringup, which is why they are declared here rather than assumed: the physical
  # robot has neither, and teleoperation additionally needs a DISPLAY.
  python3-pynput:
    optional_for: [bringup, build]
    note: "only for the interaction tier (teleoperation); also needs a DISPLAY"
  python3-pygame:
    optional_for: [bringup, build]
    note: "only for the interaction tier (speaker); also needs an audio device and assets"
project_layout:
  src: src
  assets: assets
  lab: lab
  sim: sim
  config: config
  experiments: experiments
tested:
  - os: linux
    arch: x86_64
    ros_distro: jazzy
    isaac_sim: 4.5.0
tools:
  isaacsim:
    default: "6.0"
    versions:
      "6.0":
        path: /home/zar/isaacsim
        python: /home/zar/isaacsim/python.sh
  isaaclab:
    default: "3.0.0"
    versions:
      "3.0.0":
        path: /home/zar/isaaclab

