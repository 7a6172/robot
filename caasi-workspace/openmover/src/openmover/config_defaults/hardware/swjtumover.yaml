# 物理机器人（swjtumover05）硬件参数 —— ROS 2 参数文件
#
# 来源：机器人 /dev/sda2 上 swjtumover_bringup/config/motor.yaml
#       数值已在真机上以 L4 证据核验（Phase 8）：
#         motor_state 25 Hz、rpm≈0、0 故障；odom 5 s 漂移 10 µm。
#
# 与实验室配置（hardwares.yaml）的差异全部来自真机测量，不是猜测：
#   chassis_radius           0.103   (lab 0.162)  —— 轮距 0.206 m vs 0.324 m
#   odom_compensation_ratio  1.047   (lab 1.0)    —— 真机标定系数
#   wheel_acc                1800    (lab 6000)
#   control_freq             50      (lab 100)
#
# 注意：本文件**故意不包含 actuation_enabled**。
#       物理驱动许可只能由 launch 参数显式传入（默认 false），
#       这样复制、继承或误用此 YAML 都不可能授予驱动权限。
/**:
  ros__parameters:

    motor:
      control_freq: 50

      ip_address: "192.168.100.100"
      port: 23

      wheel_max_speed_rpm: 300
      wheel_acc: 1800

      chassis_radius: 0.103
      wheel_radius: 0.05035
      odom_compensation_ratio: 1.047

# Vanjee 718H LiDAR. The addresses are this robot's internal sensor network, so they
# belong here and not in the launch file: a second robot of the same fit only replaces
# this file. Values are the ones validated on the real sensor (see phase-08 report).
vanjee_lidar_node:
  ros__parameters:
    lidar_type: vanjee_718h
    host_address: "192.168.110.10"     # robot interface facing the LiDAR
    lidar_address: "192.168.110.100"   # the LiDAR itself
    host_msop_port: 7000
    lidar_msop_port: 5000
    topic: scan                        # -> /scan, the validated contract
    frame_id: lidar_link
    min_distance: 0.25
    max_distance: 25.0
    use_lidar_clock: false             # wall-clock stamps, as in the ROS 1 baseline

# Chassis IO for this fit is the screen board, at its own endpoint. This is deliberately
# not the motor controller's port: the two share the host address and differ only by port,
# so an inherited or copied value must never be able to reach the motor controller.
screen_handler:
  ros__parameters:
    screen:
      ip_address: "192.168.100.100"
      port: 26
      control_freq: 5.0
