local_costmap:
  # 坐标系
  global_frame: odom           # 局部代价地图在里程计系下滚动，响应快
  robot_base_frame: base_link
  transform_tolerance: 0.2     # TF 允许的延迟

  # 地图窗口与分辨率（适合室内/小车）
  rolling_window: true          # 跟随机器人滚动的局部地图
  width: 4.0                    # 局部窗口宽度（m）
  height: 4.0                   # 局部窗口高度（m）
  resolution: 0.05              # 栅格分辨率（m/格）

  # 更新与发布频率
  update_frequency: 10.0
  publish_frequency: 10.0

  # 机器人足迹（按你给的尺寸，长0.32、宽0.30；顺时针顶点）
  footprint: [[0.16, 0.15], [0.16, -0.15], [-0.16, -0.15], [-0.16, 0.15]]
  footprint_padding: 0.02       # 给足迹再留一点安全边界（m）

  # 层级式代价地图插件
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}   # 动态障碍
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"} # 膨胀成安全通道

  # 障碍层参数：根据你的传感器改 topic
  obstacle_layer:
    max_obstacle_height: 0.60             # 过滤过高障碍（激光一般在平面）
    obstacle_range: 3.0                    # 障碍标记距离上限
    raytrace_range: 4.0                    # 射线清障距离上限
    track_unknown_space: false
    observation_sources: scan
    scan:
      data_type: LaserScan
      topic: /scan                         # 如果是别的雷达到这改
      expected_update_rate: 0.0
      clearing: true
      marking: true
      inf_is_valid: true

  # 膨胀层参数：控制离障碍的安全间距
  inflation_layer:
    inflation_radius: 0.03                  # 安全通道半径（m）
    cost_scaling_factor: 10.0              # 膨胀衰减系数，越大越陡（离障碍更“贵”）
