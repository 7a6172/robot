# nav2 parameters for swjtumover, converted from the ROS 1 navigation configuration.
#
# Sources (ROS 1, unchanged on the robots):
#   param/local_costmap_params.yaml, param/global_costmap_params.yaml,
#   param/global_planner_params.yaml, param/teb_local_planner_params.yaml, launch/amcl.launch
#
# The ROS 1 stack was: map_server + amcl + move_base with
#   base_global_planner = global_planner/GlobalPlanner
#   base_local_planner  = teb_local_planner/TebLocalPlannerROS
#
# Every geometric and kinematic value below is carried over unchanged. The one real
# behavioural difference is the local planner: nav2's default is DWB, not TEB. TEB also exists
# for ROS 2 (`teb_local_planner`), but its availability on the robot has not been verified, so
# this file targets DWB and keeps the TEB file in param/teb_local_planner_params.yaml for
# reference. Expect slightly different cornering behaviour until that is revisited.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.95            # odom_alpha1
    alpha2: 0.95            # odom_alpha2
    alpha3: 0.95            # odom_alpha3
    alpha4: 0.95            # odom_alpha4
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.25
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.2
    do_beamskip: true
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0   # laser_max_range
    laser_min_range: -1.0
    laser_model_type: likelihood_field_prob
    max_beams: 200
    max_particles: 5000
    min_particles: 2000
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.95
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel   # odom_model_type: diff
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 0.2
    update_min_a: 0.05
    update_min_d: 0.03
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden by the launch file with the installed map path.
    yaml_filename: nav.yaml

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # nav2's NavFn is the direct descendant of global_planner/GlobalPlanner.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5          # default_tolerance
      use_astar: false        # use_dijkstra: true -> A* off
      allow_unknown: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2      # xy_goal_tolerance
      yaw_goal_tolerance: 0.1     # yaw_goal_tolerance

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.6              # max_vel_x
      max_vel_y: 0.0
      max_vel_theta: 1.0          # max_vel_theta
      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_speed_theta: 0.0
      acc_lim_x: 0.5              # acc_lim_x
      acc_lim_y: 0.0
      acc_lim_theta: 1.0          # acc_lim_theta
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign",
                "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0      # update_frequency
      publish_frequency: 10.0     # publish_frequency
      global_frame: odom          # global_frame
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true        # rolling_window
      width: 4                    # width
      height: 4                   # height
      resolution: 0.05            # resolution
      footprint: "[[0.16, 0.15], [0.16, -0.15], [-0.16, -0.15], [-0.16, 0.15]]"
      footprint_padding: 0.02     # footprint_padding
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 0.60      # max_obstacle_height
        obstacle_max_range: 3.0        # obstacle_range
        raytrace_max_range: 4.0        # raytrace_range
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0       # update_frequency
      publish_frequency: 5.0      # publish_frequency
      global_frame: map           # global_frame
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: false       # rolling_window
      track_unknown_space: true   # track_unknown_space
      resolution: 0.05            # resolution
      footprint: "[[0.16, 0.15], [0.16, -0.15], [-0.16, -0.15], [-0.16, 0.15]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 0.60
        obstacle_max_range: 4.0        # obstacle_range
        raytrace_max_range: 5.0        # raytrace_range
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.0]      # max_vel_x, -, max_vel_theta
    min_velocity: [-0.6, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.0]         # acc_lim_x, -, acc_lim_theta
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
