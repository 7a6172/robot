# Run with: see the description -- rviz needs DISPLAY and XAUTHORITY
name: swjtumover-rviz
backend: python
script: ../scripts/caasi_launch.py
args:
- cmd
- rviz2
- -d
- ../install/swjtumover_bringup/share/swjtumover_bringup/config/bringup.rviz
description: 'rviz against an already running bringup. Needs DISPLAY and the session
  X cookie. The config path is relative to the run directory, so it follows the deployment.
  Start it on a robot with: scripts/run_teleop.sh-style DISPLAY handling, or caasi
  exec --detach -- bash -c "export DISPLAY=:0; export XAUTHORITY=$(ls /run/user/1000/.mutter-Xwaylandauth.*
  | head -1); ros2 launch ... "'
