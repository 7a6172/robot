# Run with: caasi run start experiments/mission_demo.yaml    [-t <target>]
name: swjtumover-mission-demo
backend: python
script: ../scripts/caasi_launch.py
args:
- launch
- line_then_home.launch.py
- follower_roi_bottom_offset:=70
- follower_end_confirm_frames:=100000
- follow_timeout:=40.0
description: 'The mission calibrated for this floor. The crop stops 70 px above the
  image bottom, where the tape widening into the near field otherwise dominates the
  mask (measured: that removes the rows containing a >=100 px horizontal run), and
  the end-of-line test is disabled because this tape has no distinct terminator --
  so the phase ends on the mission''s own follow timeout of 40 s, then navigates home.
  Verified: the follower commands 0.12 m/s and the robot moves.'
