# Manual for the swjtumover ROS 2 package.
#
#   pip install mkdocs          (or: pip install mkdocs-material for the material theme)
#   mkdocs serve                # http://127.0.0.1:8000
#   mkdocs build                # static site in site/
#
# Only the plain mkdocs themes are referenced so the manual builds without extra dependencies.
site_name: swjtumover — ROS 2 manual
site_description: How to deploy, run and operate the swjtumover robot with ROS 2 and with caasi
docs_dir: docs
theme:
  name: mkdocs
  navigation_depth: 3
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Running with ROS 2: ros2.md
  - Running with caasi: caasi-commands.md
  - Hardware and safety: hardware.md
  - ROS 1 vs ROS 2 audit: ros1-vs-ros2-audit.md
