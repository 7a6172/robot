# 重定位
relocalization_2d:
  publish_init_pose_topic: true
  call_init_pose_request: false

  map_frame: "map"
  base_frame: "base_link"
  lidar_frame: "lidar_link"
  prefetch_map_from_topic: true
  lidar_reverted: false
  lidar_sampling_step: 4

  enable_visualization: true

  use_reachability_sampling: true
  rrt_min_expand_dist: 0.2
  rrt_max_expand_dist: 2.0
  anchor_point_min_dist: 0.5
  min_dist_to_obstacle: 0.356
  rrt_sampling_duration: 10

  fit_score_threshold_max: 0.95
  fit_score_threshold_min: 0.85
  angle_search_step: 0.26
  area_batch_proc_number: 200
  area_candidate_number: 20

  sigma_hit: 0.2
  z_hit: 1.0
  z_rand: 0.0
  max_tolerance_dist: 3.0

  map_free_threshold: 30
  map_occupied_threshold: 55

  sensing_radius: 30.0

  max_correspondence_distance: 1.5
  transformation_epsilon: 1e-8
  euclidean_fitness_epsilon: 1e-5
  max_iterations: 200

# 导航控制器部分
navigation:
  control_freq: 100

  max_x_vel: 0.5
  min_x_vel: 0.03
  max_x_acc: 0.5
  max_yaw_vel: 1.57
  min_yaw_vel: 0.1
  max_yaw_acc: 0.6

  velocity_dec_line_offset_time: 0.05
  velocity_dec_angle_offset_time: 0.05

  strighting_tolerance: 0.005
  turning_tolerance: 0.005

  strighting_stop_distance: 0.5
  turning_stop_distance: 0.015
  ignore_obstacle_dist: 0.01

  obstacle_acc_ratio: 2.0

  use_global_planner: true
  map_occupied_threshold: 60
  max_global_plan_try_count: 2

  always_replan: true

  planner_min_dist_to_obs: 0.356

  collision_vel_dec_ratio: 1.2
  collision_plan_try_count: 1
  collision_trajectory_sampling_ratio: 3
  collision_path_sampling_ratio: 3
  collision_path_dist_error_tolerance: 0.2
  collision_path_angle_error_tolerance: 0.08
  collision_obstacle_detection_area_padding_ratio: 1.1
  collision_narrow_section_padding: 20

  allow_reverse_drive: false
  use_advanced_evaluation: true
  use_kinematic_limits: true
  use_find_mode_follower: false

  find_mode_x_vel: 0.1
  find_mode_yaw_vel: 0.2
  find_mode_radius: 0.4
  find_mode_min_dist_timeout: 1.0

  enable_near_angle_correct: false

  angle_diff_to_forward: 0.02
  angle_diff_to_rotate: 1.2

  xy_tolerance: 0.02
  yaw_tolerance: 0.01

  chassis_radius: 0.162

  sim_time: 1.2
  find_mode_sim_time: 0.2
  sim_vx_space_size: 20
  sim_vyaw_space_size: 40
  trajectory_sim_step: 30
  follow_point_weight: 1.0
  follow_path_weight: 18.0

  sensor_msg_timeout: 2.0

# 全局路径规划器部分
global_planner:
  allow_unknown: true
  default_tolerance: 0.0
  visualize_potential: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  lethal_cost: 200
  neutral_cost: 66
  cost_factor: 0.60

global_planner_static:
  allow_unknown: true
  default_tolerance: 0.0
  visualize_potential: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  lethal_cost: 200
  neutral_cost: 66
  cost_factor: 0.60

# 代价地图部分
costmap:
  global_frame: "map"
  robot_base_frame: "base_link"
  update_frequency: 1.0
  publish_frequency: 3.0
  rolling_window: false
  transform_tolerance: 5.0
  always_send_full_costmap: false

  plugins:
    - { name: static_layer, type: "costmap_2d::StaticLayer" }
    - { name: obstacle_layer, type: "costmap_2d::ObstacleLayer" }

  static_layer:
    enabled: true
    map_topic: "openmover/mapping/map"

  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true
    obstacle_range: 2.5
    raytrace_range: 3
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      {
        sensor_frame: lidar_link,
        data_type: LaserScan,
        topic: openmover/hardware/lidar/scan,
        marking: true,
        clearing: true,
      }

global_costmap:
  global_frame: "map"
  robot_base_frame: "base_link"
  update_frequency: 3.0
  publish_frequency: 3.0
  rolling_window: false
  transform_tolerance: 5.0
  always_send_full_costmap: false

  plugins:
    - { name: static_layer, type: "costmap_2d::StaticLayer" }
    - { name: obstacle_layer, type: "costmap_2d::ObstacleLayer" }

  static_layer:
    enabled: true
    map_topic: "openmover/mapping/map"

  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true
    obstacle_range: 2.5
    raytrace_range: 3
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      {
        sensor_frame: lidar_link,
        data_type: LaserScan,
        topic: openmover/hardware/lidar/scan,
        marking: true,
        clearing: true,
      }

global_costmap_static:
  global_frame: "map"
  robot_base_frame: "base_link"
  update_frequency: 3.0
  publish_frequency: 3.0
  rolling_window: false
  transform_tolerance: 5.0
  always_send_full_costmap: false

  plugins:
    - { name: static_layer, type: "costmap_2d::StaticLayer" }

  static_layer:
    enabled: true
    map_topic: "openmover/mapping/map"

localization_confidence:
  update_frequency: 2.0
  sigma_hit: 0.2
  z_hit: 1.0
  z_rand: 0.0
  max_tolerance_dist: 3.0
  map_occupied_threshold: 50

# 系统重置
reset_server:
  work_mode: 0